<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./style.css" />
    <title>Peak Distance</title>
  </head>
  <body inert>
    <header class="app-header">
      <div class="brand-row"><div class="brand-name">Peak Distance<small data-i18n="让世界的知识，走向你。">让世界的知识，走向你。</small></div>
        <div class="brand-tools"><button id="panel-mode" class="ui-icon-button" type="button" data-i18n-aria-label="切换为浮动面板" aria-label="切换为浮动面板"></button><button id="open-settings" class="ui-icon-button" type="button" data-i18n-title="设置" title="设置" data-i18n-aria-label="设置" aria-label="设置"></button><button id="panel-close" class="ui-icon-button" type="button" data-i18n-title="关闭面板" title="关闭面板" data-i18n-aria-label="关闭面板" aria-label="关闭面板"></button></div></div>
      <nav id="views" data-i18n-aria-label="主导航" aria-label="主导航"><button data-view="subs" type="button" data-i18n="当前内容">当前内容</button><button data-view="list" class="active" type="button" data-i18n="生词本">生词本</button><button data-view="chat" type="button" data-i18n="AI 问答">AI 问答</button></nav>
      <div class="brand-landscape" aria-hidden="true"></div>
    </header>
    <div class="app-content">
      <div id="panel-feedback" role="status" hidden></div>
      <div id="library-tools"><div class="section-title"><h1 data-i18n="生词本">生词本</h1><button id="review-library" class="ui-icon-button" data-view="review" type="button"></button></div><div class="library-tabs"><button data-view="list" data-i18n="词语">词语</button><button data-view="sentences" data-i18n="句子">句子</button><button data-view="knowledge" data-i18n="知识点">知识点</button></div><div class="search-combo" id="search-combo"><button id="lang-filter" type="button" data-i18n-aria-label="语言筛选" aria-label="语言筛选" aria-haspopup="listbox" aria-expanded="false" data-i18n-title="语言筛选" title="语言筛选"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.2"/><path d="M2.8 10h14.4M10 2.8c2.4 2.2 2.4 12.2 0 14.4M10 2.8c-2.4 2.2-2.4 12.2 0 14.4"/></svg></button><input id="search" type="search" data-i18n-placeholder="搜索表达…" placeholder="搜索表达…" autocomplete="off" data-i18n-aria-label="搜索表达" aria-label="搜索表达"><span id="lang-chip" hidden><span id="lang-chip-label"></span><button id="lang-chip-clear" type="button" data-i18n-aria-label="清除语言筛选" aria-label="清除语言筛选"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15"/></svg></button></span><div id="lang-menu" role="listbox" hidden></div></div></div>
    <main id="view-list" aria-live="polite">
      <div id="list"></div>
    </main>

    <main id="view-knowledge" hidden><div id="knowledge-list"></div></main>
    <main id="view-sentences" hidden><div id="sentences-list"></div></main>

    <main id="view-subs" hidden>
      <div id="subs-head"></div>
      <div id="subs-ctrl"></div>
      <div id="video-workspace"></div><div id="web-selection"></div>
    </main>

    <main id="view-review" hidden>
      <div id="review-body"></div>
    </main>

    <main id="view-chat" hidden>
      <div id="chat-head"></div>
      <div id="chat-cite-panel" hidden></div>
      <div id="chat-list"></div>
      <button id="chat-latest" type="button" hidden>↓ <span data-i18n="回到最新">回到最新</span></button>
      <div id="chat-input-row">
        <button id="chat-resize" type="button" data-i18n-aria-label="调整输入框高度（上下方向键）" aria-label="调整输入框高度（上下方向键）" data-i18n-title="拖动上边缘调整输入框高度" title="拖动上边缘调整输入框高度"></button>
        <div id="chat-attachment" hidden>
          <div class="chat-attachment-row">
            <button id="chat-attachment-chip" type="button" aria-expanded="false">
              <span id="chat-attachment-kind"></span>
              <span id="chat-attachment-summary"></span>
            </button>
            <button id="chat-attachment-remove" type="button" data-i18n-aria-label="移除材料" aria-label="移除材料" data-i18n-title="移除材料（保留问题）" title="移除材料（保留问题）">×</button>
          </div>
          <div id="chat-attachment-detail" hidden><div id="chat-attachment-focus" class="chat-attachment-focus"></div></div>
          <div id="chat-segments"></div>
        </div>
        <div id="chat-starters"></div>
        <textarea
          id="chat-input"
          rows="1"
          data-i18n-aria-label="向 AI 提问" aria-label="向 AI 提问"
          data-i18n-placeholder="想弄懂什么？" placeholder="想弄懂什么？"
        ></textarea>
        <div class="chat-composer-tools">
          <details id="chat-attachments">
            <summary data-i18n-title="附加材料" data-i18n-aria-label="附加材料"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg></summary>
            <div class="chat-attachment-menu">
              <button id="chat-attach-page" class="chat-tool" data-i18n="附加页面">附加页面</button>
              <button id="chat-attach-selection" class="chat-tool"><span data-i18n="附加选区">附加选区</span><small id="chat-attach-selection-summary"></small></button>
              <button id="chat-attach-video" class="chat-tool" data-i18n="附加视频字幕">附加视频字幕</button>
            </div>
          </details>
          <button id="chat-settings" class="chat-tool" hidden data-i18n="AI 设置">AI 设置</button>
          <button id="chat-send" type="button" data-i18n-aria-label="发送" aria-label="发送" data-i18n-title="Enter 发送，Shift + Enter 换行" title="Enter 发送，Shift + Enter 换行"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4M4 10l6-6 6 6"/></svg></button>
          <button id="chat-stop" type="button" hidden data-i18n="停止">停止</button>
        </div>
        <div id="chat-input-meta">
          <span id="chat-meta-error" role="status" hidden></span>
          <span id="chat-count"></span>
        </div>
      </div>
    </main>

    <main id="view-settings" hidden><div class="settings-heading"><button id="settings-back" data-i18n-aria-label="返回" aria-label="返回" data-i18n-title="返回" title="返回"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></button><h1 data-i18n="设置">设置</h1></div><div id="settings-body"></div></main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
